<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>three-app</title>
  </head>
  <body>
    <canvas id="webgl"></canvas>
    


    
    <div id="main-scene" class="scene active">
      <div class="bg-wrapper">
        <!-- 多层植物动画背景 -->
        <div class="animation-wrapper">
          <div id="sky-layer" class="animation-layer"></div>
          <div id="bg-layer" class="animation-layer"></div>
          <div id="far-layer" class="animation-layer"></div>
          <div id="mid-layer" class="animation-layer"></div>
          <div id="front-layer" class="animation-layer"></div>
        </div>
        <div class="svg-container">
          <!-- Lottie 动画 - bubble ui 配套动画（位置由 JavaScript 动态计算） -->
          <div id="lottie-bubble-baby" class="lottie-bubble" style="
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 101;
            pointer-events: none;
          "></div>
          <div id="lottie-bubble-kid" class="lottie-bubble" style="
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 101;
            pointer-events: none;
          "></div>
          <div id="lottie-bubble-adult" class="lottie-bubble" style="
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 101;
            pointer-events: none;
          "></div>
          <div id="lottie-bubble-old" class="lottie-bubble" style="
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 101;
            pointer-events: none;
          "></div>
          
          <!-- Lottie 动画容器 - 四个人物动画（位置由 JavaScript 动态计算） -->
          <div id="lottie-baby" class="lottie-character" style="
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 100;
            pointer-events: none;
          "></div>
          <div id="lottie-kid" class="lottie-character" style="
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 100;
            pointer-events: none;
          "></div>
          <div id="lottie-adult" class="lottie-character" style="
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 100;
            pointer-events: none;
          "></div>
          <div id="lottie-old" class="lottie-character" style="
            position: absolute;
            transform: translate(-50%, -50%);
            z-index: 100;
            pointer-events: none;
          "></div>

        </div>
      </div>
    </div>
    
    <!-- 主页面底部标题 -->
    <div class="page-title main-page-title" id="main-title">
      <img src="/标题/Asset 6.svg" alt="河南省疾病预防控制中心（试行版）">
    </div>
    

    
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
